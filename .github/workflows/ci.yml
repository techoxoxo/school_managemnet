name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolmate
          POSTGRES_PASSWORD: schoolmate_dev
          POSTGRES_DB: schoolmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: schoolmate_dev_master_key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    env:
      DATABASE_URL: postgres://schoolmate:schoolmate_dev@localhost:5432/schoolmate
      DATABASE_APP_URL: postgres://schoolmate_app:schoolmate_app_dev@localhost:5432/schoolmate
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: schoolmate_dev_master_key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run migrate -w @schoolmate/db

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:7700/health && break
            echo "waiting for meilisearch ($i)..."; sleep 2
          done

      - name: Test
        run: npm run test

      - name: Seed demo tenant (for E2E)
        run: npm run seed -w @schoolmate/db

      - name: E2E exit gate (Playwright, API-level)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check
